services:
  - type: web
    name: restaurant-pos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/pos.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ENVIRONMENT
        value: demo
      - key: ADMIN_USER
        value: sysadmin
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: restaurant-pos-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://restaurant-pos-backend.onrender.com
