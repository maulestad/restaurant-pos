version: '3.9'

services:
  backend:
    build: ./backend
    container_name: pos_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ENVIRONMENT=${ENVIRONMENT}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - pos_net

  frontend:
    build: ./frontend
    container_name: pos_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pos_net

  # Print Agent: opcional, solo si usas modo escpos_direct
  # print-agent:
  #   build: ./print-agent
  #   container_name: pos_print_agent
  #   ports:
  #     - "5000:5000"
  #   network_mode: host
  #   restart: unless-stopped

networks:
  pos_net:
    driver: bridge